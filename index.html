/* Rating page styles, matching the Miso app (frontend/src/styles/chat.css) */
:root {
  --plum: #360E4E;
  --plum-soft: #7D5F8F;
  --lilac: #E2C5F4;
  --blush: #EFE2F0;
  --mist: #E2EBF2;
  --ash: #6D8999;
  --ash-dark: #314E5E;
  --rose: #D81E53;
  --white: #FFFFFF;
  --s1: #D81E53;
  --s2: #E07A9B;
  --s3: #9B7AAF;
  --s4: #6D8999;
  --s5: #3F8F6B;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'HK Grotesk', 'Avenir Next', 'Helvetica Neue', sans-serif;
  font-weight: 500;
  color: var(--plum);
  background: linear-gradient(180deg, var(--lilac) 0%, var(--blush) 14%, var(--mist) 48%, #E6F0E2 100%) fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.serif { font-family: 'Playfair', 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; letter-spacing: -0.02em; }

/* ---------- animation helpers ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1.08); } }
.rise { opacity: 0; animation: rise .6s var(--ease) forwards; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }

/* ---------- pill buttons ---------- */
.pill {
  border: 0; border-radius: 36px; padding: 14px 28px; font-weight: 800; letter-spacing: .01em;
  background: var(--plum); color: var(--white); box-shadow: 0 8px 24px rgba(54, 14, 78, .22);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s;
}
.pill:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(54, 14, 78, .28); }
.pill:disabled { opacity: .35; cursor: default; box-shadow: none; }
.pill.ghost { background: rgba(255, 255, 255, .7); color: var(--plum); box-shadow: none; border: 1px solid var(--white); }
.link { background: none; border: 0; color: var(--ash); font-weight: 500; padding: 6px 4px; }
.link:hover { color: var(--plum); }

/* ---------- welcome & done ---------- */
.center { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; text-align: center; }
.card-hero { max-width: 520px; }
.logo { width: 76px; height: 76px; animation: float 5s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(155, 122, 175, .45)); }
.hero-title { font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1.05; margin: 14px 0 10px; }
.hero-sub { color: var(--plum-soft); font-size: 1.05rem; line-height: 1.55; margin: 0 auto 28px; max-width: 440px; }
.name-field {
  display: block; width: 100%; max-width: 360px; margin: 0 auto 18px; padding: 15px 22px; border-radius: 36px;
  border: 1px solid var(--white); background: rgba(255, 255, 255, .75); text-align: center; font-size: 1.05rem; outline: none;
  transition: box-shadow .2s, background .2s;
}
.name-field:focus { background: var(--white); box-shadow: 0 0 0 4px rgba(226, 197, 244, .8); }
.facts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 26px 0 0; color: var(--ash); font-size: .9rem; }
.facts span { background: rgba(255, 255, 255, .55); border-radius: 20px; padding: 6px 14px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 22px;
  background: rgba(239, 226, 240, .72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 1.35rem; }
.brand img { width: 26px; height: 26px; }
.dots { display: flex; gap: 8px; margin-left: 8px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--white); background: rgba(255, 255, 255, .5);
  font-size: .78rem; font-weight: 800; color: var(--ash); display: grid; place-items: center; padding: 0; transition: all .25s var(--ease); }
.dot.current { background: var(--plum); color: var(--white); border-color: var(--plum); transform: scale(1.08); }
.dot.complete { background: var(--s5); color: var(--white); border-color: var(--s5); }
.grow { flex: 1; }
.who-rates { color: var(--ash); font-size: .9rem; }
.progress { height: 3px; background: rgba(255, 255, 255, .6); }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--s3), var(--plum)); transition: width .5s var(--ease); }

/* ---------- main layout ---------- */
.stage { max-width: 1180px; margin: 0 auto; padding: 22px 22px 40px; display: grid; gap: 26px; grid-template-columns: minmax(0, 1fr); }
.stage.rating { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.kicker { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); margin: 0 0 4px; }
.stage-title { font-size: 2rem; margin: 0 0 6px; }

/* ---------- conversation ---------- */
.chat { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.stage.rating .chat { margin: 0; max-height: calc(100vh - 130px); overflow: auto; position: sticky; top: 84px; padding-right: 8px;
  mask-image: linear-gradient(180deg, transparent 0, #000 18px, #000 calc(100% - 24px), transparent 100%); }
.msg { max-width: 85%; font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .5s var(--ease) both; }
.msg.miso { align-self: flex-start; display: flex; gap: 10px; }
.msg.miso img { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.msg.user { align-self: flex-end; background: var(--white); border-radius: 26px 26px 6px 26px; padding: 12px 20px; box-shadow: 0 6px 18px rgba(109, 137, 153, .14); }
.stage.rating .msg { font-size: .95rem; }
.msg.note { align-self: stretch; max-width: none; background: rgba(255, 255, 255, .5); border: 1px dashed var(--ash); border-radius: 18px; padding: 12px 16px; font-size: .95rem; }
.msg.note .kicker { margin-bottom: 6px; }
.msg.target { outline: 2px solid var(--lilac); outline-offset: 8px; border-radius: 12px; }
.typing { align-self: flex-start; display: flex; gap: 5px; padding: 6px 0 6px 30px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--plum-soft); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.line { transition: opacity .7s var(--ease), filter .7s var(--ease); }
.line.hidden { opacity: 0; filter: blur(3px); }
.replay { align-self: flex-start; font-size: .85rem; padding: 0 0 4px; }
.read-actions { display: flex; justify-content: center; gap: 12px; margin-top: 18px; min-height: 52px; }

/* ---------- question card ---------- */
.qcard {
  align-self: start; position: sticky; top: 84px; background: rgba(255, 255, 255, .78); border: 1px solid var(--white);
  border-radius: 30px; padding: 28px 30px; box-shadow: 0 18px 50px rgba(54, 14, 78, .10);
}
.qcard.enter { animation: slideIn .45s var(--ease); }
.qcard.back { animation: slideBack .45s var(--ease); }
.qcount { display: flex; justify-content: space-between; align-items: center; color: var(--ash); font-size: .85rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.qname { font-size: 2.2rem; line-height: 1.1; margin: 14px 0 8px; }
.qtext { font-size: 1.08rem; line-height: 1.5; color: var(--plum-soft); margin: 0 0 22px; }
.scale { display: flex; justify-content: space-between; gap: 10px; }
.score {
  --c: var(--s3); width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--c); background: var(--white);
  color: var(--c); font-weight: 800; font-size: 1.25rem; transition: transform .2s var(--ease), background .2s, color .2s, box-shadow .2s;
}
.score:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(54, 14, 78, .14); }
.score.chosen { background: var(--c); color: var(--white); animation: pop .35s var(--ease) forwards; box-shadow: 0 10px 22px rgba(54, 14, 78, .22); }
.score[data-n="1"] { --c: var(--s1); } .score[data-n="2"] { --c: var(--s2); } .score[data-n="3"] { --c: var(--s3); }
.score[data-n="4"] { --c: var(--s4); } .score[data-n="5"] { --c: var(--s5); }
.ends { display: flex; justify-content: space-between; color: var(--ash); font-size: .82rem; margin: 8px 4px 0; }
.meaning { min-height: 66px; margin: 18px 0 6px; padding: 12px 16px; border-radius: 16px; background: rgba(226, 235, 242, .7); font-size: .98rem; line-height: 1.45; transition: opacity .2s; }
.meaning.empty { color: var(--ash); background: transparent; }
.meaning b { font-weight: 800; }
.hint { font-size: .85rem; color: var(--ash); min-height: 20px; }
.qnav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.examples { font-size: .9rem; color: var(--ash); margin-top: 8px; }
.examples summary { cursor: pointer; }
.examples p { margin: 6px 0 0; }
textarea.comment { width: 100%; min-height: 110px; border-radius: 20px; border: 1px solid var(--white); background: var(--white); padding: 14px 18px; outline: none; resize: vertical; }
textarea.comment:focus { box-shadow: 0 0 0 4px rgba(226, 197, 244, .8); }

/* ---------- consent, questions about the rater, reasons ---------- */
.consent { max-width: 460px; margin: 0 auto 22px; padding: 16px 20px; border-radius: 20px; background: rgba(255, 255, 255, .6);
  text-align: left; font-size: .92rem; line-height: 1.5; color: var(--plum-soft); }
.consent p { margin: 0 0 12px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 800; color: var(--plum); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--plum); }
.about { margin: 0 auto 20px; }
.about p { margin: 0 0 10px; font-weight: 800; }
.chips { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--white); background: rgba(255, 255, 255, .6); border-radius: 22px; padding: 8px 16px;
  transition: background .2s, color .2s, transform .2s var(--ease); }
.chip:hover { transform: translateY(-2px); }
.chip.on { background: var(--plum); color: var(--white); border-color: var(--plum); }
.chip-end { color: var(--ash); font-size: .82rem; }
.reason-label { display: block; margin: 14px 0 6px; font-weight: 800; }
textarea.reason { min-height: 72px; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .stage.rating { grid-template-columns: minmax(0, 1fr); }
  .stage.rating .chat { position: static; max-height: 42vh; }
  .qcard { position: static; padding: 22px 18px; }
  .score { width: 48px; height: 48px; }
  .dots { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition: none !important; }
  .rise { opacity: 1; }
}

.pill:focus { outline: none; }
.pill:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
</style>

<script>const DATA = {"study":"human-eval-tool","submitUrl":"https://script.google.com/macros/s/AKfycbxifnP_fOtjsW6so186kvYra45r4r9kSGHugTfTKdIyq0ikAKczuBwPF0qymkjR25-VKQ/exec","contact":null,"level":"day","scale":5,"criteria":[{"id":"trust","name":"Trust","text":"To what extent does the user feel that the information comes from a trustworthy source","anchors":["Claims seem made up, contradict each other or are clearly wrong; the user would doubt them","Several vague or unsupported claims, or health effects stated with too much certainty","Mostly plausible, but some claims are vague or given without any basis","Plausible and consistent, with an occasional unsupported generalisation","Accurate, consistent and grounded (explains why, or refers to guidelines), honest about limits"],"examples":{"low":"Lentils cure inflammation and will make you lose weight fast.","high":"The Swiss food pyramid suggests a portion of protein at each meal; lentils count, and they need far less water to grow than beef."}},{"id":"adaptiveness","name":"Adaptiveness","text":"To what extent does the chatbot respond, adapt and change according to what the user has written and their context","anchors":["Same generic text whatever the user says; ignores their answers and context","Repeats the user's words but does not change what it says","Adapts some replies, but misses context the user gave earlier (city, diet, preferences)","Adapts most replies to the user's answers and context, with small misses","Consistently builds on what the user said earlier and tailors examples and suggestions to them"],"examples":{"low":"User earlier: \"I'm vegetarian.\" Miso later: \"Try swapping beef for chicken.\"","high":"User earlier mentioned living in Lausanne. Miso: \"At the Lausanne market in autumn you'll find squash and apples from nearby farms.\""}},{"id":"engagement","name":"Engagement","text":"To what extent is the content exciting and engaging for the user (not boring)","anchors":["Monotonous and repetitive; reads like a list of rules; the user would drop out","Mostly flat; long blocks of text with little variety","Some engaging moments (a question, a surprising fact), but also dull stretches","Mostly lively, with variety, questions and interesting facts","Consistently engaging; facts that spark curiosity, interaction and variety make the user want to continue"],"examples":{"low":"Food waste is bad. Reduce food waste. Plan your meals.","high":"Here's a surprise: more than a quarter of Switzerland's food waste happens in our own kitchens. Which food do you end up throwing away most often?"}},{"id":"actionability","name":"Actionability","text":"To what extent are the recommendations and ideas actually actionable in the life of the user","anchors":["No recommendations, or ones that are unrealistic for the user","Only abstract advice (\"be more sustainable\") without a concrete step","Some concrete ideas, but generic or not fitted to the user's situation","Concrete, realistic steps that most users could take","Specific, realistic steps fitted to the user's own situation that they could start this week"],"examples":{"low":"Change your whole diet to be sustainable.","high":"Since you already cook lentils on Sundays, make a double batch and freeze half: that covers two weekday lunches."}},{"id":"conversational_flow","name":"Conversational flow","text":"To what extent does the conversation feel like one with a human, and not with a robot or machine","anchors":["Disjointed: abrupt topic jumps, repeated phrases, ignores what was just said","Mechanical: template-like transitions, the same opener every time","Mostly coherent, but some abrupt or formulaic transitions","Natural and coherent, with occasional mechanical moments","Flows like a conversation with a person: smooth transitions, references to earlier turns, varied phrasing"],"examples":{"low":"Every reply starts with \"Great answer! Let's move on to the next question:\"","high":"That links back to what you said about wasting bread, actually. Have you tried freezing it in slices?"}}],"items":[{"blindId":"H01","transcript":[{"role":"miso","text":"Today we’re going to explore the environmental impact of our food choices. We'll look at how our diets affect our planet through factors like carbon footprint, water use, and land use. Ready to learn how you can make a difference?"},{"role":"user","text":"Yes, I'm ready!"},{"role":"miso","text":"Let’s start by reflecting on your last meal. Can you tell me the three main ingredients?"},{"role":"user","text":"Spaghetti, beef mince and tomatoes."},{"role":"miso","text":"Greenhouse gases are released at many different stages of a food's lifecycle, from production to transportation.\n\n Out of the three ingredients spaghetti, beef mince and tomatoes, which one do you think has the highest carbon footprint?"},{"role":"user","text":"I think the beef."},{"role":"miso","text":"You are correct! Beef has a significantly higher carbon footprint than spaghetti or tomatoes.\n\nA carbon footprint is the total amount of greenhouse gases, such as carbon dioxide and methane, released into the atmosphere as a result of our actions. Reducing our carbon footprint is vital for the environment because these gases trap heat in the atmosphere, leading to global warming and climate change.\n\nBeef has a much larger environmental impact primarily because cattle are ruminant animals that produce methane—a potent greenhouse gas—during digestion. Additionally, raising cattle requires vast amounts of land and water compared to growing crops like wheat for pasta or tomatoes.\n\nIs this explanation clear, or do you need more detail?"},{"role":"user","text":"That's clear, thanks."},{"role":"miso","text":"From growing crops to animal needs, a lot water is consumed to bring food to our plates. Which of your ingredients spaghetti, beef mince and tomatoes do you think required the most water? If you are not sure, just make a guess!"},{"role":"user","text":"Probably the beef as well."},{"role":"miso","text":"You are correct! Beef requires significantly more water than spaghetti or tomatoes.\n\nWater use refers to the total amount of freshwater consumed or evaporated during the production of a product. This matters for the environment because freshwater is a finite resource; excessive use can deplete aquifers, dry up rivers, and disrupt local ecosystems that rely on those water sources.\n\nBeef has such a high water footprint because it takes a vast amount of water to grow the crops used for cattle feed, in addition to the water the animals drink throughout their lives. In contrast, while tomatoes and the grains used for spaghetti do require water, they are much more efficient at converting that water into food.\n\nIs this explanation clear, or do you need more detail?"},{"role":"user","text":"Yes, that's clear."},{"role":"miso","text":"And finally, some foods take up much more space to grow or raise than others. Looking at your ingredients spaghetti, beef mince and tomatoes, which one do you think needed the biggest amount of land to be produced?"},{"role":"user","text":"The beef, I guess."},{"role":"miso","text":"You are correct! Beef requires far more land than spaghetti or tomatoes.\n\nLand use refers to how much area of the Earth's surface is used for various purposes, such as agriculture, forestry, or urban development. This matters because how we use land directly affects biodiversity, soil health, and the ability of ecosystems to absorb carbon.\n\nThe reason beef has such a massive impact is that it requires extensive land not just for the animals to graze, but also to grow the massive amounts of crops needed to feed them. This often leads to deforestation and the conversion of natural habitats into farmland. In comparison, growing tomatoes and wheat for spaghetti is much more land-efficient because you are consuming the plants directly rather than feeding them to an animal first.\n\nDo you have any follow-up questions, or would you like to move to the next step?"},{"role":"user","text":"No questions, let's move to the next step."},{"role":"miso","text":"I acknowledge that you've shared your thoughts and that we have covered many complex topics and definitions today. I have prepared a quick guide summarising what these terms mean and why they matter for the environment. You can revisit this guide anytime through the toolbox icon to use it as a handy reference. Do you have any other questions for today?"},{"role":"user","text":"No other questions, I'm ready to move on."},{"role":"miso","text":"I'm glad you're ready to move on. Thank you for reflecting with me today. Tomorrow, we'll look at how food labels and local sourcing can further guide us in making responsible choices."},{"role":"user","text":"That's all for today, bye!"},{"role":"miso","text":"I understand that we're wrapping up for now. Thank you for reflecting with me today. Tomorrow, we'll explore how food labels and local sourcing can further help us make more responsible choices."}]},{"blindId":"H02","transcript":[{"role":"miso","text":"Today we’re going to explore the environmental impact of our food choices. We'll look at how our diets affect our planet through factors like carbon footprint, water use, and land use. Ready to learn how you can make a difference?"},{"role":"user","text":"Yes, I'm ready!"},{"role":"miso","text":"Let’s start by reflecting on your last meal. Can you tell me the three main ingredients?"},{"role":"user","text":"Spaghetti, beef mince and tomatoes."},{"role":"miso","text":"Greenhouse gases are released at many different stages of a food's lifecycle, from production to transportation.\n\nOut of the three ingredients spaghetti, beef mince, and tomatoes, which one do you think has the highest carbon footprint?"},{"role":"user","text":"I think the beef."},{"role":"miso","text":"That's correct! Beef mince indeed has one of the highest carbon footprints among common food ingredients. The carbon footprint of an item refers to the total amount of greenhouse gases, like CO2, produced directly and indirectly through its lifecycle. \n\nThe reason beef has such a significant environmental impact is due to several factors:\n\n1. **Feed Production**: Cattle consume large amounts of grains and water. The production of their feed requires energy, often involving fertilizers and pesticides, which emit greenhouse gases.\n   \n2. **Enteric Fermentation**: Cows produce methane—a potent greenhouse gas—during digestion.\n\n3. **Land Use**: Raising cattle requires a lot of land, often leading to deforestation, which releases stored carbon into the atmosphere.\n\n4. **Water Use**: Significant water is needed for both the cattle and their feed, impacting water resources.\n\nIn contrast, ingredients like spaghetti and tomatoes typically have a lower environmental impact. Pasta production involves less greenhouse gas emission compared to beef, and tomatoes are a relatively sustainable crop if grown efficiently.\n\nUnderstanding the carbon footprint and its environmental impact helps us make more eco-friendly food choices. Does this explanation help, or is there any part you'd like more detail on?"},{"role":"user","text":"That's clear, thanks."},{"role":"miso","text":"**PREDEFINED RESPONSE**\n From growing crops to animal needs, a lot water is consumed to bring food to our plates. Which of your ingredients spaghetti, beef mince and tomatoes do you think required the most water? If you are not sure, just make a guess!"},{"role":"user","text":"Probably the beef as well."},{"role":"miso","text":"Yes, you're right again! Beef not only has a high carbon footprint, but it also has a significant water footprint. \n\nWater use refers to the total volume of freshwater used to produce food, from growth and processing to consumption. Beef production requires substantial amounts of water, primarily due to the water needed for cattle feed like grains and forage, as well as the direct water requirements of the animals themselves.\n\nIn comparison, tomatoes and spaghetti use much less water overall. Tomatoes are typically more water-efficient crops, especially when grown in regions with efficient irrigation systems. Meanwhile, the water used to produce pasta is mainly for growing wheat and during food processing.\n\nBy opting for foods with lower water use, we can help conserve valuable water resources and protect ecosystems affected by agriculture. Let me know if there’s any part of this you’d like to delve deeper into!"},{"role":"user","text":"Yes, that's clear."},{"role":"miso","text":" And finally, some foods take up much more space to grow or raise than others. Looking at your ingredients spaghetti, beef mince and tomatoes, which one do you think needed the biggest amount of land to be produced?"},{"role":"user","text":"The beef, I guess."},{"role":"miso","text":"You guessed correctly! Beef requires significantly more land compared to tomatoes and spaghetti.\n\nLand use is a crucial aspect to consider because converting land for agriculture can lead to deforestation and habitat loss, negatively impacting biodiversity and contributing to climate change through the release of stored carbon.\n\nCattle farming demands large areas of land for grazing or for growing feed crops, like soy and corn. In contrast, wheat for spaghetti and tomatoes generally require less land area, and crop rotation systems can even enhance soil health and biodiversity.\n\nBy understanding land use, we can appreciate the environmental impact of our food choices on ecosystems and biodiversity. Do you have any follow-up questions or would you like to move on to the next aspect of our discussion?"},{"role":"user","text":"No questions, let's move to the next step."},{"role":"miso","text":"Today, we've covered quite a few complex topics and definitions related to how our food choices impact the environment. To help you remember and revisit these points, I've prepared a quick guide summarizing the key concepts and their environmental significance. You can access this guide anytime through the toolbox icon for a handy reference.\n\nDo you have any other questions for today?"},{"role":"user","text":"No other questions, I'm ready to move on."},{"role":"miso","text":"Thank you for reflecting with me today. Tomorrow, we'll explore how food labels and sourcing locally can further help us make responsible choices."},{"role":"user","text":"That's all for today, bye!"},{"role":"miso","text":"Thank you for taking the time to reflect with me today. Tomorrow, we’ll delve into how food labels and the benefits of local sourcing can guide us towards making more responsible choices. Have a great day!"}]},{"blindId":"H03","transcript":[{"role":"miso","text":"Today we’re going to explore the environmental impact of our food choices. We'll look at how our diets affect our planet through factors like carbon footprint, water use, and land use. Ready to learn how you can make a difference?"},{"role":"user","text":"Yes, I'm ready!"},{"role":"miso","text":"Great to hear that you're ready! Let’s start by thinking about the food you’ve recently consumed — your most recent meal, snack, or drink. Could you tell me the three main ingredients or components that made up that item?"},{"role":"user","text":"Spaghetti, beef mince and tomatoes."},{"role":"miso","text":"Out of the three ingredients — spaghetti, beef mince, and tomatoes — which one do you think has the highest carbon footprint?"},{"role":"user","text":"I think the beef."},{"role":"miso","text":"You're absolutely right — beef mince typically has the highest carbon footprint of the three. Why?\n\n**Carbon Footprint Explained:**\nA “carbon footprint” measures how much greenhouse gas (like CO₂) is emitted at every stage of a product’s life — from growing the feed for animals, to transporting them, processing the meat, and even refrigerating it at the store.\n\n**Why Beef Is So High:**\n- Cattle produce large amounts of methane (a potent greenhouse gas) as part of their digestion.\n- It takes significantly more land, water, and feed to raise cattle compared to growing crops.\n- Transporting and refrigerating beef also contributes a large portion of its footprint.\n\nIn contrast:\n- **Tomatoes**, especially if locally grown or in season, have a relatively low footprint. They require less water and energy when grown efficiently.\n- **Spaghetti** (usually made from wheat or durum): Pasta production has a moderate footprint — it depends on farming methods, transportation, and processing.\n\nSo by choosing plant-based proteins or reducing meat portions, you can make a meaningful difference in your meal’s environmental impact.\n\nIs there another dish or ingredient you'd like to explore next time?"},{"role":"user","text":"That's clear, thanks."},{"role":"miso","text":"You’re very welcome! It’s always surprising how a single ingredient can have such a big impact.\n\nIf you’d like to keep experimenting, let me know another meal or snack — or even a drink — and we can break down which component might be the biggest environmental concern. Happy (and eco-friendly) eating!"},{"role":"user","text":"Probably the beef as well."},{"role":"miso","text":"Exactly — beef remains one of the most resource-intensive foods you can eat. Each pound of beef can require anywhere from **1,800 to 2,500 gallons of water** — compare that to tomatoes (about 21-28 gallons per pound) or even wheat for pasta (which averages around 120-200 gallons per pound). That’s because cattle need vast amounts of feed, water, and land, and their natural digestive process (enteric fermentation) produces methane, a greenhouse gas many times more potent than CO₂.\n\nSo switching even one beef meal per week for a plant-based alternative could significantly reduce your personal food-related water and carbon footprint. Want to compare another meal — like a salad with chicken vs. a tofu stir-fry — or talk about where exactly the water and emissions come from in animal agriculture?"},{"role":"user","text":"Yes, that's clear."},{"role":"miso","text":"Perfect — glad the breakdown made sense to you.\n\nIf you’re open to it, let’s do one quick side-by-side comparison: say you’re deciding between a chicken thigh and a portobello mushroom for tonight’s dinner. Which one do you think uses less water, and how does that tie back to what we just learned about beef and land use? (Go ahead and share your guess — it’s just a thought exercise!)"},{"role":"user","text":"The beef, I guess."},{"role":"miso","text":"You’re right again — beef would use far more water than either chicken or a portobello mushroom.\n\nHere’s why it matters even beyond water:\n\n**Water Footprint Comparison (per kg of food):**\n- Beef: ~15,400 liters  \n- Chicken: ~4,300 liters  \n- Portobello mushrooms: ~2,000–3,000 liters  \n\nThat means one kg of beef uses more water than five kg of chicken or over seven kg of mushrooms — not to mention the massive land requirements behind beef production (cattle need pastures AND feed crops).\n\nThe big takeaway again: plant-based proteins like mushrooms, beans, lentils, or tofu tend to leave a much lighter environmental footprint on water, land, and carbon emissions. Even switching within animal products (like choosing chicken over beef) can make a noticeable difference.\n\nNext time you’re meal planning, check out a simple swap like swapping ground beef in tacos for lentils or mushrooms — you’ll still get that savory flavor without the heavy environmental toll. Want to explore a “swap recipe” idea next?"},{"role":"user","text":"No questions, let's move to the next step."},{"role":"miso","text":"Got it — moving on!\n\nLet’s wrap things up for today by saving your key takeaway:  \n🔹 **Beef has a significantly higher environmental footprint compared to plant-based proteins like mushrooms or grains.**  \n🔹 Small swaps (e.g., lentils for beef in a recipe) can reduce water and carbon impact without sacrificing flavor.\n\nThis will be stored under your custom toolbox as today’s “Eco-Friendly Ingredient Insight,” and you can revisit it anytime by asking to open your toolbox.\n\nReady when you are — next time we talk, we’ll dive into a **practical swap recipe** if you’d like."},{"role":"user","text":"No other questions, I'm ready to move on."},{"role":"miso","text":"Understood — no questions today.\n\nYour takeaway has been saved in your personal eco-toolbox:\n\n> 🔹 **Beef carries a substantially larger environmental footprint (water, land, and emissions) compared to plant-based alternatives such as mushrooms or grains.**  \n> 🔹 Small substitutions — for example, replacing ground beef with lentils in a recipe — can meaningfully lower your food-related impact without sacrificing taste.\n\nFeel free to come back anytime you want to try a specific swap recipe, explore another ingredient, or run a quick carbon-water audit on a favorite dish. Until next time!"},{"role":"user","text":"That's all for today, bye!"},{"role":"miso","text":"Goodbye for now! Take care, and happy (and mindful) eating tomorrow. ✌️"}]}]};

<script>
/* Runs in the rater's browser. DATA (items + rubric) and LOGO are defined by the page before this script. */
(function () {
  const STORE = 'miso-rating:' + DATA.study;
  const app = document.getElementById('app');
  const N = DATA.criteria.length;

  // the session comes from the link, e.g. ?s=DH411, so lecture, pilot and designer answers can be told apart
  const SESSION = (new URLSearchParams(location.search).get('s') || '').replace(/[^\w-]/g, '').slice(0, 30);

  // ---------- state, kept in the browser so a rater can stop and continue ----------
  // rater is an anonymous code (no names); order is this rater's own shuffled item order
  const fresh = () => ({ rater: '', current: 0, ratings: {}, progress: {}, finished: false, background: {}, order: [], sent: {}, started: {} });
  let state = fresh();
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) { /* storage blocked */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* not saved */ } };

  const randomInt = (n) => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };
  const newCode = () => 'P-' + Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randomInt(32)]).join('');
  function newOrder() {
    const ids = DATA.items.map((it) => it.blindId);
    for (let i = ids.length - 1; i > 0; i--) { const j = randomInt(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    return ids;
  }
  function applyOrder() {
    const valid = state.order.length === DATA.items.length && DATA.items.every((it) => state.order.includes(it.blindId));
    if (!valid) { state.order = newOrder(); save(); }
    DATA.items.sort((a, b) => state.order.indexOf(a.blindId) - state.order.indexOf(b.blindId));
  }

  // every score needs a short reason, like the LLM judges give
  const MIN_REASON = 10; // characters
  const ratingOf = (id) => {
    const r = (state.ratings[id] = state.ratings[id] || { scores: {}, comment: '' });
    r.reasons = r.reasons || {};
    return r;
  };
  const progressOf = (id) => (state.progress[id] = state.progress[id] || { read: false, q: 0 });
  const hasReason = (r, cid) => String(r.reasons[cid] || '').trim().length >= MIN_REASON;
  const isAnswered = (id, cid) => !!ratingOf(id).scores[cid] && hasReason(ratingOf(id), cid);
  const isComplete = (id) => DATA.criteria.every((c) => isAnswered(id, c.id));
  const answered = () => DATA.items.reduce((n, it) => n + DATA.criteria.filter((c) => isAnswered(it.blindId, c.id)).length, 0);

  // ---------- small helpers ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playToken = 0; // a new screen cancels any conversation still playing

  // Time to read a piece of text at about 220 words per minute
  const WORDS_PER_SECOND = 220 / 60;
  const readingTime = (text, min = 1200) => {
    const words = String(text || '').trim().split(/\s+/).length;
    return Math.max(min, Math.min(12000, (1000 * words) / WORDS_PER_SECOND));
  };

  // A Miso message is shown line by line: its paragraphs, split into sentences
  function linesOf(text) {
    return String(text || '').split(/\n+/).map((paragraph) => paragraph.trim()).filter(Boolean)
      .map((paragraph) => paragraph.split(/(?<=[.!?…])\s+(?=["“‘(]?[A-Z0-9])/));
  }

  function messagesOf(item) {
    if (DATA.level === 'day') return item.transcript.map((m) => ({ role: m.role, text: m.text }));
    const step = item.stepType === 'predefined' ? 'must be said word for word' : 'may be adapted to the user';
    return [
      { role: 'note', label: 'Script for this step (' + step + ')', text: item.script },
      { role: 'miso', text: item.previousMisoMessage || '(start of the day)' },
      { role: 'user', text: item.userMessage },
      { role: 'miso', text: item.reply, target: true },
    ];
  }

  // hidden: Miso's lines start invisible and are revealed one by one while the conversation plays
  function messageHtml(m, hidden = false) {
    if (m.role === 'note') return '<div class="msg note"><p class="kicker">' + esc(m.label) + '</p>' + rich(m.text) + '</div>';
    if (m.role === 'user') return '<div class="msg user">' + rich(m.text) + '</div>';
    const body = linesOf(m.text)
      .map((sentences) => sentences.map((line) => '<span class="line' + (hidden ? ' hidden' : '') + '">' + rich(line) + '</span>').join(' '))
      .join('\n\n');
    return '<div class="msg miso' + (m.target ? ' target' : '') + '"><img src="' + LOGO + '" alt=""><div>' + body + '</div></div>';
  }

  // ---------- welcome: what the study is, consent, anonymous code ----------
  function welcome() {
    playToken++;
    // reading at 220 words per minute, plus about 45 seconds per question (score and reason)
    const words = DATA.items.reduce((n, it) => n + messagesOf(it).reduce((k, m) => k + String(m.text || '').split(/\s+/).length, 0), 0);
    const minutes = Math.max(5, Math.round(words / 220 + (DATA.items.length * N * 3) / 4));
    const what = DATA.level === 'day' ? 'conversations' : 'replies';
    const kept = DATA.submitUrl ? 'sent to the research team under a random code' : 'saved in a file you send back, under a random code';
    app.innerHTML =
      '<div class="center"><div class="card-hero">' +
      '<div class="rise"><img class="logo" src="' + LOGO + '" alt=""></div>' +
      '<h1 class="hero-title serif rise d1">How did Miso do?</h1>' +
      '<p class="hero-sub rise d2">You will read ' + DATA.items.length + ' short ' + what + ' between a fictional user and Miso, a diet coach, ' +
      'then answer a few questions about each one. Read as if you were the user.</p>' +
      '<div class="consent rise d3"><p>This is part of an EPFL student project on the quality of chatbot replies. ' +
      'We do not ask for your name or email. Your ratings, comments and the optional questions about you are ' + kept + '. ' +
      'Taking part is voluntary and you can stop at any time.' +
      (DATA.contact ? ' Questions or want your answers removed? Contact ' + esc(DATA.contact) + ' with your code.' : '') + '</p>' +
      '<label class="check"><input type="checkbox" id="agree"> I have read this and agree to take part</label></div>' +
      '<div class="rise d3"><button class="pill" id="start" disabled>Let\'s start</button></div>' +
      '<div class="facts rise d4"><span>' + DATA.items.length + ' ' + what + '</span><span>' + N + ' questions each</span>' +
      '<span>about ' + minutes + ' min</span><span>anonymous</span></div>' +
      '</div></div>';
    const agree = document.getElementById('agree');
    const button = document.getElementById('start');
    agree.onchange = () => { button.disabled = !agree.checked; };
    button.onclick = () => {
      if (!agree.checked) return;
      state = Object.assign(fresh(), { rater: newCode(), order: newOrder() });
      save();
      applyOrder();
      about();
    };
  }

  // ---------- three optional questions about the rater, for the analysis ----------
  const ABOUT = [
    { id: 'interest', text: 'How interested are you in eating more sustainably?', options: ['1', '2', '3', '4', '5'], ends: ['Not at all', 'Very'] },
    { id: 'chatbots', text: 'How often do you use AI chatbots?', options: ['Never', 'Monthly', 'Weekly', 'Daily'] },
    { id: 'english', text: 'Is English your first language?', options: ['Yes', 'No'] },
  ];

  function about() {
    playToken++;
    const bg = state.background;
    app.innerHTML =
      '<div class="center"><div class="card-hero">' +
      '<p class="kicker rise">Your code: ' + esc(state.rater) + '</p>' +
      '<h1 class="hero-title serif rise d1">A bit about you</h1>' +
      '<p class="hero-sub rise d2">Three quick questions. All optional.</p>' +
      ABOUT.map((q, i) =>
        '<div class="about rise d' + Math.min(4, i + 2) + '"><p>' + esc(q.text) + '</p><div class="chips">' +
        (q.ends ? '<span class="chip-end">' + q.ends[0] + '</span>' : '') +
        q.options.map((o) => '<button class="chip' + (bg[q.id] === o ? ' on' : '') + '" data-q="' + q.id + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') +
        (q.ends ? '<span class="chip-end">' + q.ends[1] + '</span>' : '') + '</div></div>').join('') +
      '<div class="rise d4"><button class="pill" id="go">Start reading</button></div>' +
      '</div></div>';
    app.querySelectorAll('.chip').forEach((b) => {
      b.onclick = () => {
        bg[b.dataset.q] = bg[b.dataset.q] === b.dataset.o ? undefined : b.dataset.o;
        save();
        app.querySelectorAll('.chip[data-q="' + b.dataset.q + '"]').forEach((c) => c.classList.toggle('on', bg[c.dataset.q] === c.dataset.o));
      };
    });
    document.getElementById('go').onclick = () => { state.aboutDone = true; save(); showItem(0); };
  }

  // ---------- sending a finished item to the Google Sheet ----------
  function rowOf(it) {
    const r = ratingOf(it.blindId);
    const row = { received: '', study: DATA.study, session: SESSION, rater: state.rater, item: it.blindId, position: state.order.indexOf(it.blindId) + 1 };
    DATA.criteria.forEach((c) => { row[c.id] = r.scores[c.id] == null ? '' : r.scores[c.id]; });
    DATA.criteria.forEach((c) => { row[c.id + '_reason'] = String(r.reasons[c.id] || '').trim(); });
    row.comment = r.comment;
    row.seconds = state.started[it.blindId] ? Math.round((Date.now() - state.started[it.blindId]) / 1000) : '';
    ABOUT.forEach((q) => { row[q.id] = state.background[q.id] || ''; });
    return row;
  }

  // The Apps Script answers without CORS headers, so the reply cannot be read: a request that
  // reaches the server counts as sent. text/plain avoids a CORS preflight.
  // an item is sent once at a time; a send still on its way is not "unsent"
  const sending = new Set();
  async function send(it) {
    if (!DATA.submitUrl || !isComplete(it.blindId) || sending.has(it.blindId)) return;
    sending.add(it.blindId);
    try {
      await fetch(DATA.submitUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rowOf(it)) });
      state.sent[it.blindId] = true;
    } catch (e) {
      state.sent[it.blindId] = false;
    }
    sending.delete(it.blindId);
    save();
    if (state.finished && document.getElementById('restart')) done(); // refresh the thank-you screen
  }
  const unsent = () => DATA.items.filter((it) => isComplete(it.blindId) && !state.sent[it.blindId] && !sending.has(it.blindId));

  // ---------- top bar ----------
  function topbar() {
    const dots = DATA.items.map((it, i) => {
      const cls = i === state.current ? 'current' : isComplete(it.blindId) ? 'complete' : '';
      return '<button class="dot ' + cls + '" data-go="' + i + '" title="' + (DATA.level === 'day' ? 'Conversation ' : 'Reply ') + (i + 1) + '">' + (i + 1) + '</button>';
    }).join('');
    const pct = Math.round((100 * answered()) / (DATA.items.length * N));
    return '<div class="topbar"><div class="brand serif"><img src="' + LOGO + '" alt="">Miso</div>' +
      '<div class="dots">' + dots + '</div><span class="grow"></span>' +
      '<span class="who-rates">' + esc(state.rater) + '</span><button class="link" id="finish">Finish</button></div>' +
      '<div class="progress"><div style="width:' + pct + '%"></div></div>';
  }

  function wireTopbar() {
    app.querySelectorAll('[data-go]').forEach((b) => { b.onclick = () => showItem(Number(b.dataset.go)); });
    document.getElementById('finish').onclick = done;
  }

  // ---------- one item: read, then rate ----------
  function showItem(i) {
    state.current = Math.max(0, Math.min(DATA.items.length - 1, i));
    state.finished = false;
    save();
    const item = DATA.items[state.current];
    // play the conversation unless this item is already fully rated (then open it for review)
    if (isComplete(item.blindId)) rate(item); else read(item);
    window.scrollTo(0, 0);
  }

  // The conversation in steps: Miso's opening, then one exchange (user reply + Miso's answer) per step
  function exchangesOf(messages) {
    const steps = [[]];
    for (const m of messages) {
      if (m.role === 'user' && steps[steps.length - 1].length) steps.push([]);
      steps[steps.length - 1].push(m);
    }
    return steps;
  }

  // The rater moves through the conversation one exchange at a time (button, Space, Enter or →)
  function read(item) {
    const token = ++playToken;
    if (!state.started[item.blindId]) { state.started[item.blindId] = Date.now(); save(); }
    const label = DATA.level === 'day' ? 'Conversation' : 'Reply';
    app.innerHTML = topbar() +
      '<div class="stage"><div class="chat"><div class="rise"><p class="kicker">' + label + ' ' + (state.current + 1) + ' of ' + DATA.items.length + '</p>' +
      '<h2 class="stage-title serif">Read it as the user</h2></div><div id="feed" class="chat"></div></div>' +
      '<div class="read-actions"><button class="pill" id="continue">Continue ▸</button>' +
      '<button class="link" id="skip">Show all</button></div></div>';
    wireTopbar();
    const feed = document.getElementById('feed');
    const steps = exchangesOf(messagesOf(item));
    const button = document.getElementById('continue');
    let shown = 0;
    let finishStep = null; // set while a step is animating; calling it shows the rest at once
    let skipping = false;

    async function playStep(step) {
      let instant = reduceMotion;
      finishStep = () => { instant = true; };
      const pause = async (ms) => {
        const end = Date.now() + ms;
        while (!instant && token === playToken && Date.now() < end) await wait(60);
      };
      for (const m of step) {
        if (token !== playToken) return;
        if (m.role !== 'miso') {
          feed.insertAdjacentHTML('beforeend', messageHtml(m));
          feed.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
          await pause(500);
          continue;
        }
        if (!instant) {
          feed.insertAdjacentHTML('beforeend', '<div class="typing"><i></i><i></i><i></i></div>');
          feed.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
          await pause(900);
          feed.querySelector('.typing')?.remove();
        }
        feed.insertAdjacentHTML('beforeend', messageHtml(m, !instant));
        for (const line of feed.lastElementChild.querySelectorAll('.line')) {
          if (token !== playToken) return;
          line.classList.remove('hidden');
          line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          await pause(550);
        }
      }
      feed.querySelector('.typing')?.remove();
      finishStep = null;
    }

    function finished() {
      progressOf(item.blindId).read = true;
      save();
      document.onkeydown = null;
      const actions = document.querySelector('.read-actions');
      actions.innerHTML = '<button class="pill rise" id="torate">Rate this ' + (DATA.level === 'day' ? 'conversation' : 'reply') + ' →</button>';
      document.getElementById('torate').onclick = () => rate(item);
      actions.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function next() {
      if (token !== playToken) return;
      if (finishStep) { finishStep(); return; } // a click during an animation completes it
      if (shown >= steps.length) return;
      await playStep(steps[shown]);
      shown += 1;
      if (token !== playToken || skipping) return;
      button.textContent = 'Continue ▸ (' + shown + ' of ' + steps.length + ')';
      if (shown >= steps.length) finished();
      else button.focus({ preventScroll: true });
    }

    button.onclick = next;
    document.getElementById('skip').onclick = async () => {
      if (skipping) return;
      skipping = true;
      if (finishStep) finishStep();
      while (finishStep && token === playToken) await wait(30); // let the current exchange finish first
      await wait(0);
      feed.querySelectorAll('.typing').forEach((t) => t.remove());
      while (token === playToken && shown < steps.length) {
        steps[shown].forEach((m) => feed.insertAdjacentHTML('beforeend', messageHtml(m)));
        shown += 1;
      }
      finished();
    };
    document.onkeydown = (e) => {
      if ([' ', 'Enter', 'ArrowRight'].includes(e.key)) { e.preventDefault(); next(); }
    };
    next(); // Miso's opening message plays straight away
  }

  function rate(item, direction) {
    playToken++;
    const p = progressOf(item.blindId);
    app.innerHTML = topbar() +
      '<div class="stage rating"><div class="chat"><button class="link replay" id="replay">↺ Replay conversation</button>' +
      messagesOf(item).map((m) => messageHtml(m)).join('') + '</div>' +
      '<div id="card"></div></div>';
    wireTopbar();
    document.getElementById('replay').onclick = () => { document.onkeydown = null; read(item); };
    if (p.q >= N) commentCard(item, direction); else questionCard(item, direction);
  }

  // ---------- question card ----------
  function meaningHtml(c, n) {
    if (!n) return 'Pick the number that fits best. Hover a number to see what it means.';
    return '<b>' + n + '</b> · ' + esc(c.anchors[n - 1]);
  }

  function questionCard(item, direction) {
    const p = progressOf(item.blindId);
    const c = DATA.criteria[p.q];
    const r = ratingOf(item.blindId);
    const card = document.getElementById('card');
    const buttons = [1, 2, 3, 4, 5].slice(0, DATA.scale).map((n) => '<button class="score" data-n="' + n + '">' + n + '</button>').join('');
    const examples = c.examples
      ? '<details class="examples"><summary>See an example</summary><p><b>Low:</b> ' + esc(c.examples.low) + '</p><p><b>High:</b> ' + esc(c.examples.high) + '</p></details>'
      : '';
    card.innerHTML =
      '<div class="qcard ' + (direction === 'back' ? 'back' : 'enter') + '">' +
      '<div class="qcount"><span>Question ' + (p.q + 1) + ' of ' + N + '</span></div>' +
      '<h2 class="qname serif">' + esc(c.name) + '</h2><p class="qtext">' + esc(c.text) + '</p>' +
      '<div class="scale">' + buttons + '</div><div class="ends"><span>Poor</span><span>Excellent</span></div>' +
      '<div class="meaning" id="meaning"></div>' +
      '<label class="reason-label" for="reason">Why this number?</label>' +
      '<textarea class="comment reason" id="reason" placeholder="A sentence is enough, e.g. what in the conversation made you choose it">' + esc(r.reasons[c.id]) + '</textarea>' +
      '<div class="hint" id="reasonhint"></div>' + examples +
      '<div class="qnav"><button class="link" id="back">← Back</button><button class="pill" id="next">Next</button></div></div>';

    const meaning = document.getElementById('meaning');
    const next = document.getElementById('next');
    const paint = () => {
      const chosen = r.scores[c.id];
      card.querySelectorAll('.score').forEach((b) => b.classList.toggle('chosen', Number(b.dataset.n) === chosen));
      meaning.innerHTML = meaningHtml(c, chosen);
      meaning.classList.toggle('empty', !chosen);
      const enough = hasReason(r, c.id);
      reasonHint.textContent = chosen && !enough ? 'Please add a short reason to continue.' : '';
      next.disabled = !chosen || !enough;
    };
    const reasonHint = document.getElementById('reasonhint');
    document.getElementById('reason').oninput = (e) => {
      r.reasons[c.id] = e.target.value;
      state.sent[item.blindId] = false;
      save();
      paint();
      document.querySelector('.progress > div').style.width = Math.round((100 * answered()) / (DATA.items.length * N)) + '%';
    };
    // one score per question: another number replaces the choice
    const pick = (n) => {
      r.scores[c.id] = n;
      state.sent[item.blindId] = false; // a changed answer is sent again
      save();
      paint();
      document.querySelector('.progress > div').style.width = Math.round((100 * answered()) / (DATA.items.length * N)) + '%';
    };
    card.querySelectorAll('.score').forEach((b) => {
      const n = Number(b.dataset.n);
      b.onclick = () => pick(n);
      b.onmouseenter = () => { meaning.innerHTML = meaningHtml(c, n); meaning.classList.remove('empty'); };
      b.onmouseleave = paint;
    });
    const goNext = () => { if (!isAnswered(item.blindId, c.id)) return; p.q += 1; save(); p.q >= N ? commentCard(item) : questionCard(item); };
    const goBack = () => {
      if (p.q === 0) { p.read = true; save(); read(item); return; }
      p.q -= 1; save(); questionCard(item, 'back');
    };
    next.onclick = goNext;
    document.getElementById('back').onclick = goBack;
    document.onkeydown = (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (/^[1-9]$/.test(e.key) && Number(e.key) <= DATA.scale) pick(Number(e.key));
      else if (e.key === 'Enter' || e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') goBack();
    };
    paint();
  }

  // ---------- comment card, then the next item ----------
  function commentCard(item, direction) {
    document.onkeydown = null;
    const r = ratingOf(item.blindId);
    const p = progressOf(item.blindId);
    const last = state.current === DATA.items.length - 1;
    document.getElementById('card').innerHTML =
      '<div class="qcard ' + (direction === 'back' ? 'back' : 'enter') + '">' +
      '<div class="qcount"><span>Almost done</span></div>' +
      '<h2 class="qname serif">Anything else?</h2><p class="qtext">Optional: what stood out, good or bad?</p>' +
      '<textarea class="comment" id="comment" placeholder="Write a comment…">' + esc(r.comment) + '</textarea>' +
      '<div class="qnav"><button class="link" id="back">← Back</button>' +
      '<button class="pill" id="next">' + (last ? 'Finish' : 'Next ' + (DATA.level === 'day' ? 'conversation' : 'reply') + ' →') + '</button></div></div>';
    document.getElementById('comment').oninput = (e) => { r.comment = e.target.value; state.sent[item.blindId] = false; save(); };
    document.getElementById('back').onclick = () => { p.q = N - 1; save(); questionCard(item, 'back'); };
    document.getElementById('next').onclick = () => {
      if (!state.sent[item.blindId]) send(item); // runs in the background while the next item opens
      const open = DATA.items.findIndex((it, i) => i > state.current && !isComplete(it.blindId));
      if (open !== -1) showItem(open);
      else if (!last) showItem(state.current + 1);
      else done();
    };
  }

  // ---------- done ----------
  function done() {
    playToken++;
    document.onkeydown = null;
    state.finished = true;
    save();
    const complete = DATA.items.filter((it) => isComplete(it.blindId)).length;
    const missing = DATA.items.length - complete;
    const online = !!DATA.submitUrl;
    const pending = unsent().length;
    let message;
    if (missing) message = complete + ' of ' + DATA.items.length + ' rated. Incomplete ones are left out of the comparison.';
    else if (!online) message = 'All ' + DATA.items.length + ' rated. Download your answers and send the file back.';
    else if (sending.size) message = 'Sending your answers…';
    else if (pending) message = pending + ' answer(s) could not be sent yet. Check your connection and try again.';
    else message = 'All ' + DATA.items.length + ' rated and sent. You can close this page.';
    const main = online && pending ? '<button class="pill" id="retry">Send again</button>'
      : !online ? '<button class="pill" id="download">Download my ratings</button>' : '';
    app.innerHTML =
      '<div class="center"><div class="card-hero">' +
      '<div class="rise"><img class="logo" src="' + LOGO + '" alt=""></div>' +
      '<h1 class="hero-title serif rise d1">' + (missing ? 'Nearly there' : 'Thank you!') + '</h1>' +
      '<p class="hero-sub rise d2">' + message + '</p>' +
      '<p class="kicker rise d2">Your code: ' + esc(state.rater) + '</p>' +
      (main ? '<div class="rise d3">' + main + '</div>' : '') +
      '<div class="facts rise d4"><button class="link" id="review">' + (missing ? 'Continue rating' : 'Review my answers') + '</button>' +
      (online ? '<button class="link" id="download">Download a copy</button>' : '') +
      '<button class="link" id="restart">New participant on this device</button></div>' +
      '</div></div>';
    document.getElementById('download').onclick = download;
    const retry = document.getElementById('retry');
    if (retry) retry.onclick = async () => { retry.disabled = true; for (const it of unsent()) await send(it); done(); };
    document.getElementById('review').onclick = () => {
      const open = DATA.items.findIndex((it) => !isComplete(it.blindId));
      showItem(open === -1 ? 0 : open);
    };
    document.getElementById('restart').onclick = () => {
      if (online && unsent().length) return; // keep answers that have not reached the Sheet
      if (!confirm('Start again as a new participant? Your answers stay with the research team.')) return;
      state = fresh();
      save();
      welcome();
    };
    // answers finished offline are sent as soon as this screen opens
    if (online && pending) unsent().forEach(send);
  }

  // ---------- CSV in the format `npm run human -- compare` reads ----------
  const csvCell = (v) => (/[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));

  function download() {
    const rows = DATA.items.map(rowOf);
    const header = Object.keys(rows[0]).filter((k) => k !== 'received');
    const csv = [header].concat(rows.map((row) => header.map((h) => row[h]))).map((row) => row.map(csvCell).join(',')).join('\n') + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'ratings_' + state.rater + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- start ----------
  if (!state.rater) welcome();
  else {
    applyOrder();
    if (state.finished) done();
    else if (!state.aboutDone) about();
    else showItem(state.current);
  }
})();
</script>
</body>
</html>
